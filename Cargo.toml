[package]
name = "recurrence-lab"
version = "0.2.0"
edition = "2021"
description = "Rust と Lean によるローカル漸化式演習アプリ"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
lto = "thin"
strip = true

