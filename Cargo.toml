[package]
name = "recurrence-lab"
version = "0.3.0"
edition = "2021"
description = "Rust と Lean によるローカル漸化式演習アプリ"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "recurrence-lab"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["dep:axum", "dep:tokio", "dep:uuid", "dep:libc", "rand/std", "rand/std_rng"]
browser = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rand = { version = "0.8", default-features = false, features = ["alloc"] }
rand_chacha = "0.3"
sha2 = "0.10"
hex = "0.4"
wasm-bindgen = { version = "=0.2.105", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
libc = { version = "0.2", optional = true }

[profile.release]
lto = "thin"
strip = true

