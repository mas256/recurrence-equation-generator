name: Windows desktop app

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', 'browser/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci
          npx tauri build
      - name: Check the installer and the bundled page
        shell: pwsh
        run: |
          $installers = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          $page = Get-Content -Raw -Encoding utf8 desktop/dist/index.html
          if (-not $page.Contains('このPCで実行')) { throw 'The desktop wording was not applied' }
          "Built $($installers[0].Name) ($([math]::Round($installers[0].Length / 1MB, 1)) MB)"
      - uses: actions/upload-artifact@v4
        with:
          name: recurrence-lab-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish the installer to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "漸化式ラボ Windows版 ${tag#desktop-}" \
              --notes "Windows用のインストーラーです。ダウンロードして実行すると、スタートメニューに「漸化式ラボ」が追加されます。問題の生成と確認はPC内で行い、通信は不要です。"
          fi
          gh release upload "$tag" desktop/src-tauri/target/release/bundle/nsis/*.exe --clobber
